<!-- Container principal -->
<div class="container mt-4">

  <h3>Usuarios</h3>
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Password</th>
        <th>Rol</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (user of usuarios; track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.nombre }}</td>
          <td>{{ user.email }}</td>
          <td><code>{{ user.password }}</code></td>
          <td>
            <span class="badge" [ngClass]="user.rol === 'Administrador' ? 'bg-danger' : 'bg-primary'">
              {{ user.rol }}
            </span>
          </td>
          <td>
            <button class="btn btn-sm btn-primary me-1" (click)="editarUsuario(user)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="eliminarUsuario(user.id)">Eliminar</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="text-center text-muted">No hay usuarios registrados en el sistema.</td>
        </tr>
      }
    </tbody>
  </table>

  <h3 class="mt-5">Agregar / Modificar Usuario</h3>
  <form (ngSubmit)="agregarUsuario()" class="card p-4 bg-light mb-5">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" name="nombre" [(ngModel)]="nuevoUsuario.nombre" class="form-control" placeholder="Nombre del usuario" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" [(ngModel)]="nuevoUsuario.email" class="form-control" placeholder="Email" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" [(ngModel)]="nuevoUsuario.password" class="form-control" placeholder="Password" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Rol</label>
      <select name="rol" [(ngModel)]="nuevoUsuario.rol" class="form-select">
        <option value="Usuario">Usuario (Empleado)</option>
        <option value="Administrador">Administrador</option>
      </select>
    </div>
    <button type="submit" class="btn btn-success">Registrar Usuario</button>
  </form>
</div>
